<!doctype html>
<html lang="ar" dir="rtl">
<head>
<script src="./polyfills.js?v=mwck669i"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>المافيا</title>
<link rel="stylesheet" href="./style.css?v=mwck669i">
<script src="./online-config.js"></script>
<script src="./ui.js?v=mwck669i"></script>
<script src="./rules.js?v=mwck669i"></script>
<style>
body{min-height:100%;font-size:16px;background:radial-gradient(520px 360px at 50% -160px,rgba(224,30,46,.2),transparent 70%),var(--bg)}
body.night{background:radial-gradient(520px 360px at 50% -160px,rgba(245,245,245,.07),transparent 70%),#020202}
.wrap{max-width:480px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(88px + env(safe-area-inset-bottom))}

/* app bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:36px;height:auto;flex:none}
.brand .wordmark{font-size:24px}
.brand .who{font-size:13px;color:var(--text-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{display:flex;gap:8px}
.chipbtn{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:14px;font-weight:700;transition:background var(--dur-fast)}
.chipbtn:active{background:var(--surface-3)}
.chipbtn .i{width:18px;height:18px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;margin-bottom:14px;animation:fadeUp .45s var(--ease) both}
.eyebrow{display:inline-flex;align-items:center;gap:6px;color:var(--red);font-size:13px;font-weight:700;margin-bottom:6px}
.eyebrow .i{width:16px;height:16px}
.card h2{font-size:22px;font-weight:900;line-height:1.3}
.card p{color:var(--text-2);line-height:1.65;font-size:15px;margin-top:6px}
.center{text-align:center}
.big{font-size:28px;font-weight:900;line-height:1.25}
.hero-ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:4px auto 12px;border:1.5px solid var(--line-strong);background:var(--surface-2)}
.hero-ic .i{width:30px;height:30px}
.hero-ic.red{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 32px var(--red-glow)}

/* form */
label.fl{display:block;font-size:14px;font-weight:700;color:var(--text-2);margin:16px 0 8px}
.input{width:100%;font:inherit;font-size:18px;height:56px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line-strong);background:var(--bg);color:var(--text);outline:none;transition:border-color var(--dur-fast)}
.input:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-tint)}
.input.code{text-align:center;font-weight:900;font-size:24px;letter-spacing:.3em}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:14px;font-size:17px;font-weight:900;background:var(--surface-2);border:1.5px solid var(--line-strong);margin-top:14px;transition:transform var(--dur-fast),background var(--dur-fast)}
.btn:active{transform:scale(.98)}
.btn .i{width:20px;height:20px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:active{background:var(--red-hover)}
.btn.ghost{background:none;border-color:transparent;color:var(--text-2);font-weight:700;font-size:15px}
.btn[disabled]{opacity:.4}
.err{color:#FF5A66;font-weight:700;margin-top:10px;font-size:14px;min-height:1em}

/* choice list */
.list{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 14px;border-radius:14px;background:var(--surface-2);border:1.5px solid transparent;font-size:17px;font-weight:700;text-align:right;width:100%;transition:border-color var(--dur-fast),background var(--dur-fast)}
.opt .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font-weight:900;flex:none}
.opt .nm{flex:1;min-width:0}
.opt .note{display:block;font-size:13px;color:var(--text-2);font-weight:400;margin-top:2px}
.opt .note.red{color:#FF5A66}
.opt .radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-strong);flex:none;display:grid;place-items:center}
.opt .radio .i{width:14px;height:14px;opacity:0}
.opt.sel{border-color:var(--text);background:var(--white-tint)}
.opt.sel .radio{background:var(--text);border-color:var(--text);color:var(--bg)}
.opt.sel .radio .i{opacity:1}
.opt.sel.kill{border-color:var(--red);background:var(--red-tint)}
.opt.sel.kill .radio{background:var(--red);border-color:var(--red);color:#fff}
.opt[disabled]{opacity:.38}
.opt.static{cursor:default}
.opt.me{border-color:var(--line-strong)}
.opt.dead{opacity:.42}.opt.dead .nm{text-decoration:line-through}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:7px;padding:3px 8px;border:1px solid var(--line-strong);color:var(--text-2);flex:none}
.tag .i{width:13px;height:13px}
.tag.mafia{background:var(--red);border-color:var(--red);color:#fff}

/* role card */
.role{border-radius:var(--radius-lg);padding:28px 20px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;border:1.5px solid var(--line-strong);
  background:linear-gradient(170deg,var(--surface-2),var(--surface) 70%);animation:fadeUp .45s var(--ease) both;cursor:pointer;user-select:none;-webkit-user-select:none}
.role .ric{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--text);margin-bottom:6px}
.role .ric .i{width:40px;height:40px}
.role .team{font-size:13px;font-weight:700;color:var(--text-2);letter-spacing:.02em}
.role .rn{font-size:40px;font-weight:900;line-height:1.1}
.role .rd{font-size:15px;line-height:1.65;color:var(--text-2);max-width:330px}
.role .mates{margin-top:8px;padding:10px 14px;border-radius:12px;background:var(--red-tint);font-size:15px;color:var(--text)}
.role .mates b{color:#FF5A66}
.role .tiny{font-size:12px;color:var(--text-3);margin-top:8px}
.role.mafia{border-color:var(--red);background:linear-gradient(170deg,#3A0710,var(--surface) 75%);box-shadow:0 0 48px -12px var(--red-glow)}
.role.mafia .ric{background:var(--red);border-color:var(--red);color:#fff}
.role.mafia .team{color:#FF5A66}

.dead-banner{display:flex;align-items:center;gap:10px;background:var(--red-tint);border:1px solid var(--red-deep);color:#FFB3BA;border-radius:14px;padding:12px 14px;font-weight:700;margin-bottom:14px;font-size:15px}
.dead-banner .i{color:var(--red)}
.checks{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.checks div{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:15px}
.result{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:16px;text-align:center;font-size:20px;font-weight:900;margin-top:14px;animation:fadeUp .4s var(--ease) both;border:1.5px solid var(--text)}
.result.mafia{background:var(--red);border-color:var(--red);color:#fff}
.huge{font-size:60px;font-weight:900;font-variant-numeric:tabular-nums;direction:ltr;letter-spacing:-.02em;line-height:1.1;margin:6px 0}
.prog{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--text-2);text-align:center;margin-top:12px;font-size:14px}
.prog .i{width:16px;height:16px}
.small{font-size:13px;color:var(--text-3);text-align:center;margin-top:16px}

/* overlays */
.overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(3,3,3,.94);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9;animation:fadeIn var(--dur) both}
.overlay .inner{width:100%;max-width:420px}
.rules-ov{align-items:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:calc(20px + env(safe-area-inset-top))}
.rules-ov .inner{padding-bottom:20px}
.rin section{margin-bottom:16px}
.rin .kicker{display:inline-flex;align-items:center;gap:6px;color:var(--red);font-weight:700;font-size:14px}
.rin .kicker .i{width:16px;height:16px}
.rin h2{font-size:28px;font-weight:900;margin:4px 0 8px}
.rin h3{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:900;margin-bottom:8px}
.rin h3 .i{width:18px;height:18px;color:var(--red)} .rin h3.mt{margin-top:14px}
.rin p{color:var(--text-2);line-height:1.7;font-size:15px;margin-bottom:6px}
.rin b{color:var(--text)} .rin b.red{color:#FF5A66}
.r-roles{display:flex;flex-direction:column;gap:10px}
.r-role{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.r-role .r-ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-strong)}
.r-role .r-ic .i{width:22px;height:22px}
.r-role h3{margin:0;font-size:18px}
.r-role .r-team{font-size:12px;color:var(--text-3)}
.r-role p{grid-column:1/-1;margin:4px 0 0;font-size:14px}
.r-role.is-mafia{border-color:var(--red);background:linear-gradient(160deg,rgba(224,30,46,.16),var(--surface) 60%)}
.r-role.is-mafia .r-ic{background:var(--red);border-color:var(--red);color:#fff}
.r-role.is-mafia .r-team{color:#FF5A66}
.r-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;color:var(--text-2);font-size:15px;line-height:1.7}
.r-box ol,.r-box ul{padding-inline-start:20px}
.r-box li{margin-bottom:4px}
.rules-close{position:sticky;bottom:0}

/* privacy cover */
#cover{position:fixed;top:0;right:0;bottom:0;left:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;
  background:radial-gradient(420px 420px at 50% 40%,rgba(224,30,46,.16),transparent 70%),var(--bg)}
#cover .logo{width:230px;max-width:56vw;height:auto;animation:drift 6s ease-in-out infinite;filter:drop-shadow(0 18px 40px rgba(224,30,46,.25))}
#cover .wordmark{font-size:52px}
#cover .st{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-size:16px;font-weight:700;margin-top:6px}
#cover .st .i{width:18px;height:18px;color:var(--red)}
#cover .tap{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--text-2);animation:pulse 2.2s infinite}
#cover .tap .i{width:18px;height:18px}
.hidebtn{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:8;display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 22px;border:1px solid var(--line-strong);background:rgba(14,14,15,.94);backdrop-filter:blur(8px);border-radius:999px;font-size:15px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.hidebtn .i{width:18px;height:18px}
.vlist{margin-top:12px;flex-direction:column;align-items:stretch}
.vbtn{width:100%;min-height:52px;font-size:16px}
.btn.rec{animation:breathe 1.6s infinite}
.btn.rec #reccd{direction:ltr;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="brand"><span id="brandLogo"></span><div><div class="wordmark">المافيا</div><div class="who" id="meName"></div></div></div>
    <div class="tb">
      <button class="chipbtn" id="rulesBtn" aria-label="القوانين"></button>
      <button class="chipbtn hidden" id="peekBtn" aria-label="دوري"></button>
    </div>
  </div>
  <div id="view"></div>
  <div class="small" id="conn"></div>
</div>

<div id="cover" class="hidden" role="button" aria-label="اضغط للعرض">
  <span id="coverLogo"></span>
  <div class="wordmark">المافيا<span class="en">MAFIA</span></div>
  <div class="st" id="coverSt"></div>
  <div class="tap" id="coverTap"></div>
</div>
<button class="hidebtn hidden" id="hideBtn"></button>
<div class="overlay hidden" id="ov"><div class="inner" id="ovInner"></div></div>
<div class="overlay rules-ov hidden" id="rov"><div class="inner"><div class="rin" id="rulesIn"></div>
  <button class="btn primary rules-close" id="rulesClose"></button></div></div>

<script src="./play.js?v=mwck669i"></script>
</body>
</html>
