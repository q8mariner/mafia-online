<!doctype html>
<html lang="ar" dir="rtl">
<head>
<script src="./polyfills.js?v=mwd5n5e4"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المافيا — شاشة الراوي</title>
<link rel="stylesheet" href="./style.css?v=mwd5n5e4">
<script src="./qrcode.js?v=mwd5n5e4"></script>
<script src="./online-config.js"></script>
<script src="./ui.js?v=mwd5n5e4"></script>
<script src="./rules.js?v=mwd5n5e4"></script>
<style>
html{font-size:1.25vw}
body{overflow:hidden;background:radial-gradient(70rem 40rem at 50% -18rem,rgba(224,30,46,.16),transparent 70%),var(--bg);transition:background var(--dur-slow)}
body.night{background:radial-gradient(70rem 40rem at 50% -18rem,rgba(245,245,245,.06),transparent 70%),#020202}
body::after{content:"";position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
#app{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;padding:1.6rem 2.8rem 1.1rem;z-index:1}

/* header */
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.3rem}
.brand{display:flex;align-items:center;gap:.9rem}
.brand .logo{width:3.6rem;height:auto}
.brand .wordmark{font-size:2.3rem}
.tools{display:flex;gap:.6rem;align-items:center}
.status{display:inline-flex;align-items:center;gap:.5rem;height:2.6rem;padding:0 1.1rem;border-radius:999px;border:1px solid var(--line);font-size:1rem;color:var(--text-2);background:var(--surface)}
.status .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--red);box-shadow:0 0 .6rem var(--red)}
main{flex:1;min-height:0;display:flex}
footer{display:flex;justify-content:space-between;align-items:center;color:var(--text-3);font-size:.9rem;margin-top:.8rem}
footer span{display:inline-flex;align-items:center;gap:.4rem}
footer .url{direction:ltr;font-weight:700;color:var(--text-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;height:3.6rem;padding:0 1.8rem;border-radius:var(--radius);font-size:1.3rem;font-weight:700;
  background:var(--surface-2);border:1.5px solid var(--line-strong);color:var(--text);outline:none;
  transition:transform var(--dur-fast) var(--ease),background var(--dur-fast),border-color var(--dur-fast),box-shadow var(--dur-fast)}
.btn .i{width:1.3rem;height:1.3rem}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{height:2.6rem;padding:0 1rem;font-size:1rem;border-radius:var(--radius-sm)}
.btn.sm .i{width:1.1rem;height:1.1rem}
.btn.icon{width:2.8rem;padding:0}
.btn:focus-visible,.btn:focus{border-color:#fff;box-shadow:0 0 0 .25rem rgba(245,245,245,.22);transform:scale(1.05)}
.btn.primary:focus{box-shadow:0 0 0 .25rem rgba(245,245,245,.3),0 0 2.4rem var(--red-glow)}
.btn[disabled]{opacity:.35;cursor:not-allowed}

/* lobby */
.lobby{display:grid;grid-template-columns:22rem 1fr;gap:1.8rem;width:100%;min-height:0}
.join{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;align-self:start}
.join .head{background:var(--red);color:#fff;padding:.9rem 1.2rem;display:flex;align-items:center;gap:.6rem;font-size:1.25rem;font-weight:900}
.join .body{padding:1.3rem;display:flex;flex-direction:column;align-items:center;gap:1rem}
.qr{width:17.5rem;height:17.5rem;background:#fff;border-radius:var(--radius);padding:1rem}
.qr svg{width:100%;height:100%;display:block}
.url{direction:ltr;font-size:1.3rem;font-weight:700;letter-spacing:.02em;border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:.45rem 1rem;background:var(--surface-2)}
.hint{display:flex;gap:.6rem;align-items:flex-start;color:var(--text-2);font-size:.95rem;line-height:1.5}
.hint .i{color:var(--red);margin-top:.15rem}
.noip{display:flex;flex-direction:column;align-items:center;gap:.8rem;text-align:center;color:var(--text-2);font-size:1.15rem;padding:2rem 1rem}
.noip .i{width:3rem;height:3rem;color:var(--red)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:1.3rem 1.5rem;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ptitle{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem}
.ptitle h2{font-size:1.6rem;font-weight:900}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:2.2rem;height:2rem;padding:0 .7rem;border-radius:999px;background:var(--red);color:#fff;font-weight:900;font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;align-content:start}
.tile{display:flex;align-items:center;gap:.6rem;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:.55rem .7rem;font-size:1.2rem;font-weight:700;min-width:0;animation:fadeUp .4s var(--ease) both}
.tile .on,.tile .off{width:.55rem;height:.55rem;border-radius:50%;flex:none}
.tile .on{background:#F5F5F5;box-shadow:0 0 .5rem rgba(245,245,245,.6)} .tile .off{background:var(--line-strong)}
.tile .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .kick{width:2rem;height:2rem;border-radius:.6rem;display:grid;place-items:center;color:var(--text-3);border:1.5px solid transparent;flex:none;outline:none}
.tile .kick .i{width:1rem;height:1rem}
.tile .kick:focus{border-color:#fff;color:#fff;background:var(--red)}
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:.8rem;color:var(--text-3);font-size:1.3rem;padding:2.4rem 0}
.empty .i{width:2.6rem;height:2.6rem}

.settings{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.55rem;margin-top:auto;padding-top:1rem}
.set{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:.4rem .4rem;display:flex;align-items:center;justify-content:space-between;gap:.4rem;min-width:0}
.set .lbl{display:flex;align-items:center;gap:.3rem;color:var(--text-2);font-size:.84rem;white-space:nowrap;min-width:0;overflow:hidden}
.set .lbl small{font-size:.72rem;color:var(--text-3)}
.set .lbl .i{color:var(--red);width:1rem;height:1rem;flex:none}
.stepper{display:flex;align-items:center;gap:.4rem}
.set .btn.icon{width:2.1rem;height:2.1rem}
.set.wide{grid-column:span 2}
.set .sw{height:2rem;padding:0 .15rem}.set .sw i{width:2.3rem;height:1.35rem}.set .sw i::after{width:.95rem;height:.95rem}.set .sw.on i::after{right:1.15rem}
.stepper{gap:.25rem!important}
.stepper b{min-width:2rem;text-align:center;font-size:1.35rem;font-variant-numeric:tabular-nums}
.sw{display:inline-flex;align-items:center;gap:.5rem;height:2.4rem;padding:0 .35rem;flex:none;border-radius:999px;border:1.5px solid var(--line-strong);font-size:.95rem;font-weight:700;color:var(--text-2);outline:none;transition:all var(--dur-fast)}
.sw i{width:2.6rem;height:1.5rem;border-radius:999px;background:var(--surface-3);position:relative;transition:background var(--dur-fast)}
.sw i::after{content:"";position:absolute;top:.2rem;right:.2rem;width:1.1rem;height:1.1rem;border-radius:50%;background:var(--text-3);transition:all var(--dur) var(--ease)}
.sw.on{color:var(--text)} .sw.on i{background:var(--red)} .sw.on i::after{right:1.3rem;background:#fff}
.sw:focus{border-color:#fff;box-shadow:0 0 0 .25rem rgba(245,245,245,.22)}
.cta{display:flex;align-items:center;gap:1rem;margin-top:.8rem}
.cta .btn{white-space:nowrap}
.deck{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.6rem;align-items:center}
.deck .tag{font-size:.78rem;padding:.1rem .45rem}
.cta .note{color:var(--text-2);font-size:1.05rem}
.err{color:var(--red);font-size:1.05rem;font-weight:700}

footer .url{font-size:.9rem;padding:.15rem .6rem}
/* stage screens */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.1rem}
.orb{width:7.5rem;height:7.5rem;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-strong);background:var(--surface);animation:drift 6s ease-in-out infinite}
.orb .i{width:3.4rem;height:3.4rem}
.orb.red{border-color:var(--red);color:var(--red);animation:drift 6s ease-in-out infinite,breathe 3s ease-in-out infinite}
.orb.white{box-shadow:0 0 5rem 1rem rgba(245,245,245,.08)}
.kicker{display:inline-flex;align-items:center;gap:.5rem;font-size:1.25rem;font-weight:700;color:var(--red);letter-spacing:.02em}
.kicker .i{width:1.2rem;height:1.2rem}
.huge{font-size:5.2rem;font-weight:900;line-height:1.05;letter-spacing:-.02em}
.lead{font-size:1.5rem;color:var(--text-2);max-width:58rem;line-height:1.6}
.bar{width:36rem;height:.6rem;border-radius:1rem;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:1rem;transition:width var(--dur-slow) var(--ease);margin-inline-start:0}
.meta{color:var(--text-2);font-size:1.2rem;font-variant-numeric:tabular-nums}
.countdown{font-size:10rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;direction:ltr;letter-spacing:-.03em}
.countdown.low{color:var(--red);animation:pulse 1s infinite}
.victim{font-size:5.6rem;font-weight:900;color:var(--red);line-height:1;animation:fadeUp .9s var(--ease) both;text-shadow:0 0 3rem var(--red-glow)}
.rolechip{display:inline-flex;align-items:center;gap:.7rem;font-size:1.7rem;font-weight:900;padding:.7rem 1.6rem;border-radius:var(--radius);border:2px solid var(--text);animation:fadeUp .9s .5s var(--ease) both}
.rolechip .i{width:1.7rem;height:1.7rem}
.rolechip.mafia{background:var(--red);border-color:var(--red);color:#fff;animation:fadeUp .9s .5s var(--ease) both,breathe 2.4s 1.4s infinite}
.wide{width:100%;max-width:86rem}
.ptile{display:flex;align-items:center;gap:.7rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.6rem .8rem;font-size:1.25rem;font-weight:700;min-width:0;transition:border-color var(--dur)}
.ptile .av{width:2.3rem;height:2.3rem;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font-weight:900;flex:none}
.ptile .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.ptile.done{border-color:var(--text)} .ptile.done .av{background:var(--text);color:var(--bg)}
.ptile.dead{opacity:.4} .ptile.dead .nm{text-decoration:line-through}
.ptile .st .i{width:1.2rem;height:1.2rem}
.tag{display:inline-flex;align-items:center;gap:.3rem;font-size:.85rem;font-weight:700;border-radius:.45rem;padding:.15rem .55rem;border:1px solid var(--line-strong);color:var(--text-2);flex:none}
.tag .i{width:.9rem;height:.9rem}
.tag.mafia{background:var(--red);border-color:var(--red);color:#fff}
.actions{display:flex;gap:1rem;justify-content:center;margin-top:.4rem}
.tally{display:flex;flex-direction:column;gap:.6rem;width:58rem}
.trow{display:grid;grid-template-columns:11rem 1fr 3rem;align-items:center;gap:1rem;font-size:1.25rem;font-weight:700;text-align:right}
.trow .tb{height:2.2rem;border-radius:.6rem;background:var(--surface-2);overflow:hidden;position:relative}
.trow .tb i{position:absolute;top:0;bottom:0;right:0;background:linear-gradient(270deg,var(--red),var(--red-deep));border-radius:.6rem}
.trow .tv{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;padding:0 .8rem;font-size:.95rem;font-weight:400;color:#fff;white-space:nowrap;overflow:hidden}
.trow b{text-align:center;font-size:1.4rem}
.over{gap:.8rem}
.over .logo{width:6.4rem;height:auto;flex:none;filter:drop-shadow(0 0 2rem rgba(224,30,46,.3))}
.banner{font-size:4.8rem;font-weight:900;line-height:1.05}
.banner.mafia{color:var(--red);text-shadow:0 0 3.5rem var(--red-glow)}
.log{font-size:.9rem;color:var(--text-3);line-height:1.7;columns:2;column-gap:3rem;text-align:right;max-width:76rem}

/* rules overlay */
.rov{position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;background:rgba(3,3,3,.985);padding:1.6rem 2.8rem;animation:fadeIn var(--dur) both;overflow:hidden}
.rin{height:100%;display:flex;flex-direction:column;gap:.6rem;font-size:.84rem;line-height:1.45}
.rin h2{font-size:1.9rem;font-weight:900;margin:.1rem 0}
.rin h3{display:flex;align-items:center;gap:.5rem;font-size:1.15rem;font-weight:900;margin-bottom:.4rem}
.rin h3 .i{color:var(--red)} .rin h3.mt{margin-top:.8rem}
.r-intro p{color:var(--text-2);font-size:.95rem;max-width:70rem}
.r-intro b{color:var(--text)} .r-intro b.red,.r-box b.red{color:var(--red)}
.r-roles{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
.r-role{display:grid;grid-template-columns:auto 1fr;gap:.25rem .7rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.6rem .9rem}
.r-role .r-ic{width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-strong)}
.r-role .r-ic .i{width:1.5rem;height:1.5rem}
.r-role h3{font-size:1.2rem;margin:0}
.r-role .r-team{font-size:.85rem;color:var(--text-3)}
.r-role p{grid-column:1/-1;color:var(--text-2)}
.r-role.is-mafia{border-color:var(--red);background:linear-gradient(160deg,rgba(224,30,46,.18),var(--surface) 60%)}
.r-role.is-mafia .r-ic{background:var(--red);border-color:var(--red);color:#fff}
.r-role.is-mafia .r-team{color:var(--red)}
.r-cols{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:.9rem;flex:1;min-height:0}
.r-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:.7rem 1rem;color:var(--text-2)}
.r-box ol,.r-box ul{padding-inline-start:1.2rem;display:flex;flex-direction:column;gap:.25rem}
.r-box p{margin-bottom:.4rem} .r-box b{color:var(--text)}
.rov .closerow{position:absolute;top:1.6rem;left:2.8rem}
.accused{display:flex;gap:1.4rem;justify-content:center;flex-wrap:wrap}
.acc{display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:1rem 1.6rem;border:2px solid var(--red);border-radius:var(--radius);background:var(--surface-2);min-width:9rem;animation:fadeUp .6s var(--ease) both}
.acc .av{width:3.4rem;height:3.4rem;border-radius:50%;display:grid;place-items:center;background:var(--red);color:#fff;font-size:1.6rem;font-weight:900}
.acc b{font-size:1.6rem}
.acc small{color:var(--text-3);font-size:.95rem}
.code{display:flex;flex-direction:column;align-items:center;gap:.1rem}
.code small{color:var(--text-3);font-size:.9rem}
.code b{direction:ltr;font-size:2.6rem;font-weight:900;letter-spacing:.3em;margin-inline-end:-.3em;color:#fff}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.create .logo.big{width:9rem;height:auto}
.create .input{width:30rem;max-width:90vw;font-size:1.4rem;padding:.9rem 1.2rem;border-radius:var(--radius);border:1.5px solid var(--line-strong);background:var(--surface-2);color:var(--text);font-family:inherit;text-align:center}
.create .input:focus{outline:none;border-color:#fff;box-shadow:0 0 0 .25rem rgba(245,245,245,.22)}
.create .err{color:var(--red);min-height:1.4em}
.vtitle{display:flex;align-items:center;gap:.5rem;color:var(--text-2);font-size:1.1rem}
.vbtn.tv{font-size:1.3rem;padding:.8rem 1.3rem;min-width:15rem}
.vbtn.tv .vic{width:2.6rem;height:2.6rem}
.create .modes{display:flex;gap:1.6rem;justify-content:center;flex-wrap:wrap}
.create .mode{width:26rem;display:flex;flex-direction:column;align-items:center;gap:.6rem;padding:1.6rem 1.4rem;border-radius:var(--radius-lg);border:2px solid var(--line-strong);background:var(--surface);color:var(--text);text-align:center;outline:none}
.create .mode .i{width:3rem;height:3rem;color:var(--red)}
.create .mode b{font-size:1.7rem;font-weight:900}
.create .mode span{color:var(--text-2);font-size:1rem;line-height:1.6}
.create .mode.sel{border-color:var(--red);background:var(--surface-2);box-shadow:0 0 0 .3rem var(--red-tint)}
.create .mode:focus{border-color:#fff}
.join.compact .qr{width:12.5rem;height:12.5rem;padding:.7rem}
.join.compact .body{gap:.75rem}
.set.locked{opacity:.45}
.set.locked .sw{cursor:not-allowed}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span id="brandLogo"></span><div class="wordmark">المافيا</div></div>
    <div class="tools">
      <span class="status" id="status"><span class="dot"></span><span id="statusTxt"></span></span>
      <button class="btn sm" id="rulesBtn" data-k="rules"></button>
      <button class="btn sm" id="soundBtn" data-k="sound"></button>
    </div>
  </header>
  <main id="main"></main>
  <footer><span id="foot"></span><span id="remoteHint"></span></footer>
</div>
<div class="rov hidden" id="rulesOv"><div class="rin" id="rulesIn"></div>
  <div class="closerow"><button class="btn sm primary" id="rulesClose"></button></div></div>

<script src="./tv.js?v=mwd5n5e4"></script>
</body>
</html>
